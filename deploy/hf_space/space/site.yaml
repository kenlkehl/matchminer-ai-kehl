# Site config of the MatchMiner-AI Hugging Face Space (matchminer_ai.site; keys: docs/reference/site-config.md).
# Synthetic data and public models only. Every hf:// value is a file or folder of a Hub repository, downloaded into
# the Space's Hugging Face cache when the app first reads it.
#
# The dataset revision: the Space variable MMAI_DATASET_REVISION when set (pin a commit there), else the dataset's
# main branch, so a dataset update reaches the Space with a restart (deploy/hf_space/refresh.py). A file or folder
# the revision does not have reads as missing: that feature is then unavailable, not an error.
paths:
  # Writable: the app's store, caches, the trial management file and the synthetic run's folder. MMAI_DATA_ROOT
  # overrides it (the Dockerfile sets it; entrypoint.sh moves it to /data when a storage bucket is mounted there).
  data_root: /home/user/mmai-data

dashboard:
  # The published synthetic run: its trials, patients and corpus. The app builds the run folder it reads from the
  # dataset (apps.dashboard.hub_run), with the dataset's round 3 vectors when it publishes them, else embedding the
  # corpus with the published TrialSpace (the preset's pinned ksg-dfci/TrialSpace-1226). The decision model is the
  # published, pinned ksg-dfci/MatchEval-1226.
  synthetic_run: hf://datasets/ksg-dfci/mmai-synthetic-1226@${MMAI_DATASET_REVISION:-main}

  # Guideline catalogs (the Patient-centric Guidelines sub-tab, Guideline concordance reporting): the dataset's NCI
  # PDQ catalogs. While the dataset has none, the guideline views are hidden.
  guideline_catalogs: hf://datasets/ksg-dfci/mmai-synthetic-1226@${MMAI_DATASET_REVISION:-main}/guideline_catalogs/pdq

  synthetic:
    # The trials shown (Clinical trial management, Patient-centric search): a cohort table and trial tables merged by
    # nct_id (apps.dashboard.synthetic_trials). Now the published run's 5,000 trials; another trial set in the dataset
    # (e.g. a trials_ctgov_all/ folder) is these lines plus a restart. Cohorts without the run's TrialSpace vectors are
    # embedded when the app starts.
    trial_cohorts: hf://datasets/ksg-dfci/mmai-synthetic-1226@${MMAI_DATASET_REVISION:-main}/trials/retrieval_cohorts.parquet
    trial_tables:
      - hf://datasets/ksg-dfci/mmai-synthetic-1226@${MMAI_DATASET_REVISION:-main}/trials/ctgov_sample_trials.parquet
      - hf://datasets/ksg-dfci/mmai-synthetic-1226@${MMAI_DATASET_REVISION:-main}/trials/ctgov_trials_with_cohorts.parquet
    # Population management samples these (1,000 test-split patients with seed 23 by default).
    population_summaries: hf://datasets/ksg-dfci/mmai-synthetic-1226@${MMAI_DATASET_REVISION:-main}/summaries/patient_summaries_with_spaces.parquet
    population_notes: hf://datasets/ksg-dfci/mmai-synthetic-1226@${MMAI_DATASET_REVISION:-main}/patients/all_synthetic_notes.parquet
    population_split: test
    population_key: patient_id
    # The structured extraction store (Nemotron 3.5 Super, the 1,000-patient test sample). A new store: change
    # this line's folder.
    extraction_records: hf://datasets/ksg-dfci/mmai-synthetic-1226@${MMAI_DATASET_REVISION:-main}/extraction_records/n5000_test1000_nemotron
    # The trials' drugs and drug classes.
    good_options_catalog: hf://datasets/ksg-dfci/mmai-synthetic-1226@${MMAI_DATASET_REVISION:-main}/good_options_catalog/n5000
    # No benchmark_roots: the Benchmarking tab stays hidden.
    # The Space page shows the app in a frame.
    frame_ancestors: [https://huggingface.co]
    # The hosted OpenRouter connection: only where the Space has the secret MMAI_OPENROUTER_HOSTED_KEY (the lite
    # Space), the owner's OpenRouter key serves visitors who paste no key of their own, for this one model (the key's
    # guardrail on OpenRouter allows only it), and is never shown. Without the secret (the RTX PRO Space) nothing is
    # offered. OpenRouter's free models allow 20 requests a minute and 50 a day per account (1,000 a day once it has
    # bought $10 of credits), counting failed requests: the app sends at most requests_per_minute for everyone (the
    # others wait), session_daily_requests per browser session and UTC day, and stops at daily_reserve requests left
    # today (OpenRouter's GET /api/v1/key). A 429 is not retried.
    hosted_openrouter:
      model: nvidia/nemotron-3.5-super-vl:free
      label: Nemotron 3.5 Super
      requests_per_minute: 16
      session_daily_requests: 150
      daily_reserve: 20
    # Every LLM task uses the app's own model server on the Space's GPU, started once the decision model has loaded;
    # the only other model connection accepted is OpenRouter with a visitor's own API key (allow_openrouter: while
    # the server loads, or on hardware without a suitable GPU). On the RTX PRO 6000 (96 GB): vLLM serving Nemotron
    # 3.5 Super NVFP4, text only, as NVIDIA's model card serves it on one GPU and as the production servers do (the
    # package's Super profile gives the reasoning and tool parsers and the sampling). Memory: about 70 GiB of
    # weights, then the KV and Mamba caches inside 84% of the GPU; the remaining ~15 GiB hold the decision model and
    # TrialSpace, which the app loads on the same GPU. On a smaller GPU tier.py picks Bolt's GGUF with llama.cpp (from
    # 40 GB) or no local server (a T4, the lite Space): OpenRouter is then the only LLM connection, with the hosted
    # key (hosted_openrouter, above) as every task's default where the Space has it.
    local_server:
      only: true
      default: true
      allow_openrouter: true
      autostart:
        engine: vllm
        model: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
        revision: ae1368329b1fc76b71534c5d04b87b35d9cc6e15
        gpus: [0]
        trust_remote_code: true
        enable_prefix_caching: true
        gpu_memory_utilization: 0.84
        max_model_len: 262144
        max_num_seqs: 8
        # The model's own MTP head drafts tokens (the card's RTX PRO 6000 setting); no drafter download.
        speculative_config: {method: mtp, num_speculative_tokens: 5}
        extra_args: [--language-model-only, --max-num-batched-tokens, "8192", --block-size, "64",
                     --prefix-match-unit, "64", --mamba-backend, flashinfer, --mamba-ssm-cache-dtype, float16,
                     --enable-mamba-cache-stochastic-rounding, --mamba-cache-philox-rounds, "5",
                     --mamba-cache-mode, align, --enable-mamba-shared-prefix-checkpoint, --async-scheduling,
                     --chat-template-content-format, string]
