name: Hugging Face Space

# Rebuilds the Spaces from this commit whenever main changes the app: uploads deploy/hf_space/space/ with MMAI_COMMIT
# (deploy/hf_space/publish.py, which also gives a Space its own card), and each Space builds that commit:
# - ksg-dfci/matchminer-ai-1226 (T4, the lite image: no local LLM; OpenRouter with the Space's hosted key or each
#   visitor's own).
# The RTX PRO 6000 Space (ksg-dfci/matchminer-ai-1226-rtxpro, Nemotron 3.5 Super in vLLM) is private and paused, so it
# is not rebuilt here: publish it by hand (publish.py --space) before restarting it.
# Needs the repository secret HF_TOKEN: a Hugging Face token with write access to every Space listed. Each Space is
# its own job, so one that fails (a token without access to it) does not stop the other.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "frontend/dashboard/**"
      - "docs/**"  # the How this works tab serves pages of docs/
      - "pyproject.toml"
      - "deploy/hf_space/**"
      - ".github/workflows/hf-space.yml"
  workflow_dispatch:
    inputs:
      factory_rebuild:
        description: Rebuild without Docker's layer cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hf-space
  cancel-in-progress: true  # a later push supersedes an earlier one

jobs:
  publish:
    name: Publish ${{ matrix.space }}
    if: github.repository == 'kenlkehl/matchminer-ai-kehl'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        space:
          - ksg-dfci/matchminer-ai-1226

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install huggingface_hub
        run: python -m pip install "huggingface_hub>=1.14"

      - name: Upload the Space files and the commit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_REBUILD: ${{ inputs.factory_rebuild && '--factory-rebuild' || '' }}
          SPACE: ${{ matrix.space }}
        run: python deploy/hf_space/publish.py --space "$SPACE" --commit "$GITHUB_SHA" $FACTORY_REBUILD
