# Known models of the local model server (matchminer_ai.llm.local_server; the dashboard's Data and models tab).
# Each model's settings come from its model card, per engine:
# - model: the engine's repository when it differs (a GGUF repository for llama.cpp);
# - compute_capabilities / why: the GPUs the engine's recipe runs on ("12.x": any 12.*); the form proposes the other
#   engine on other GPUs and says why;
# - spec: ServerSpec fields; variants: alternatives by the chosen GPUs' free memory (the first that fits is used);
# - served_name: the API's model name (the base model's ID, so the app's request profile matches it on every engine);
# - tokenizer: a repository with the tokenizer, for the app's prompt budgets;
# - reasoning: whether "Use for every task" turns the model's thinking switch on by default (off unless set).
default: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
models:
  nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB:
    label: Nemotron 3.5 Bolt 74B-A9B (2-bit, 24 GB)
    license: OpenMDW-1.1
    served_name: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
    tokenizer: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
    # Verified 2026-11-24. Text only: the cards' image and video settings (the vision projector, local media
    # paths) are left out.
    source: >-
      https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB (vLLM) and
      https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-GGUF (llama.cpp)
    engines:
      vllm:
        # The card's recipe: a vLLM nightly (vllm/vllm-openai:nightly-77154ca6116ae34cbfe314beef1016bde9b63989 or
        # newer) with `pip install b12x` and `vllm download-kernels`; the card lists Blackwell SM 12.0/12.1.
        compute_capabilities: ["12.0", "12.1"]
        why: vLLM's Bolt recipe (b12x kernels) runs on Blackwell SM 12.0 and 12.1 only
        note: Needs a vLLM nightly with the b12x package and its kernels (vllm download-kernels).
        spec:
          trust_remote_code: true
          tensor_parallel_size: 1
          max_model_len: 262144
          max_num_seqs: 1
          kv_cache_dtype: fp8
          reasoning_parser: ultra_v3
          reasoning_parser_plugin: ultra_v3_reasoning_parser.py
          tool_call_parser: qwen3_coder
          env:
            VLLM_USE_V2_MODEL_RUNNER: "1"
          speculative_config:
            method: dflash
            model: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr
            num_speculative_tokens: 7
            rejection_sample_method: standard
            attention_backend: FLASHINFER
            draft_load_config: {load_format: auto}
          extra_args: [--load-format, auto, --enable-chunked-prefill, --linear-backend, b12x, --moe-backend, b12x,
                       --attention-backend, FLASHINFER, --mamba-backend, flashinfer, --mamba-ssm-cache-dtype, bfloat16,
                       --mamba-cache-dtype, bfloat16, --mamba-cache-mode, align, --seed, "42"]
      llama_cpp:
        model: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-GGUF
        # The card lists Ada Lovelace and Blackwell; other recent CUDA GPUs run llama.cpp too.
        note: The card's llama.cpp recipes need a recent llama.cpp (DFlash speculative decoding).
        spec:
          gguf: NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
          n_gpu_layers: 999
          parallel: 1
          kv_unified: true
          flash_attn: "on"
          draft_model: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr-GGUF
          draft_gguf: NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr.gguf
          draft_type: draft-dflash
          extra_args: [--temp, "1.0", --top-p, "0.95"]
        variants:
          - name: 32GB recipe
            memory_gb: 32
            note: The card's recipe for 48 GB GPUs and RTX Spark 128 GB, with the full 262,144-token context.
            spec: {ctx_size: 262144, batch_size: 4096, ubatch_size: 2048, draft_tokens: 7}
          - name: 28GB recipe
            memory_gb: 28
            note: The card's recipe for 32 GB GPUs and RTX Spark 64 GB, with a q8_0 KV cache.
            spec: {ctx_size: 65536, batch_size: 2048, ubatch_size: 512, draft_tokens: 6, cache_type_k: q8_0,
                   cache_type_v: q8_0}
  Qwen/Qwen3-0.6B:
    label: Qwen3 0.6B (small; for checking a setup)
    license: Apache-2.0
    served_name: Qwen/Qwen3-0.6B
    tokenizer: Qwen/Qwen3-0.6B
    reasoning: false
    source: https://huggingface.co/Qwen/Qwen3-0.6B and https://huggingface.co/Qwen/Qwen3-0.6B-GGUF
    # The model's full 40,960-token context, so the LLM checks' 32,768-token output reserve fits beside a prompt.
    engines:
      vllm:
        spec: {max_model_len: 40960}
      llama_cpp:
        model: Qwen/Qwen3-0.6B-GGUF
        spec: {gguf: Qwen3-0.6B-Q8_0.gguf, ctx_size: 40960, parallel: 4, kv_unified: true}
